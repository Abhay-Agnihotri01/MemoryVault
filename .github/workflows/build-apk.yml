name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch: # Allows you to manually trigger the build from GitHub website

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install NPM Dependencies
        run: npm install --legacy-peer-deps

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Accept Android SDK Licenses
        run: |
          yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses || true

      # Capacitor config requires a web assets folder to sync, even though we load from Vercel
      - name: Create Dummy Web Assets
        run: |
          mkdir -p out
          echo "<html><body>MemoryVault Native App</body></html>" > out/index.html

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build Debug APK with Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: memoryvault-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
